<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find your nearest location</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f7f7;color:#111}
.box{width:100%;max-width:400px;padding:24px;text-align:center}
h1{font-size:20px;font-weight:500;margin:0 0 8px}p{font-size:14px;color:#666;margin:0 0 16px}
.spin{width:32px;height:32px;border:3px solid #ddd;border-top-color:#222;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e5e5e5;text-align:left}
.item a{color:#0b5fd1;text-decoration:none;font-size:14px;margin-left:12px;white-space:nowrap}
.item span{font-size:14px;font-weight:500}
.link{background:none;border:none;color:#0b5fd1;font-size:14px;cursor:pointer;padding:0}
</style></head><body><div class="box">
<div id="finding"><div class="spin"></div><h1>Finding your nearest location</h1><p>Please allow location access so we can take you to the closest branch.</p><button class="link" id="manual">Choose a branch instead</button></div>
<div id="going" style="display:none"><h1>Taking you there...</h1><p id="msg"></p></div>
<div id="pick" style="display:none"><h1>Choose your branch</h1><p>Select the location you visited.</p><div id="items"></div></div>
</div><script>
var branches=[{"name":"NC - Charlotte","lat":35.32115756335589,"lng":-80.82450211826222,"url":"https://g.page/r/CTp3qlIZo1awEAE/review"},{"name":"NC - Indian Land","lat":35.005295333899014,"lng":-80.89469785026685,"url":"https://g.page/r/CbHsgAHI7hcEEAE/review"},{"name":"GA - Austell","lat":33.87073820530597,"lng":-84.49904506706878,"url":"https://g.page/r/CY8tLupLcu_zEAE/review"},{"name":"GA - Conyers","lat":33.65303435060797,"lng":-84.0234430734284,"url":"https://g.page/r/CY8tLupLcu_zEAE/review"},{"name":"GA - Fayetteville","lat":33.498940429043834,"lng":-84.43650373129604,"url":"https://g.page/r/CY8tLupLcu_zEAE/review"},{"name":"GA - Gainesville","lat":34.24999097184547,"lng":-83.97792542922707,"url":"https://g.page/r/CY8tLupLcu_zEAE/review"},{"name":"GA - Lawerenceville","lat":33.97918385613952,"lng":-83.53935696077828,"url":"https://g.page/r/CY8tLupLcu_zEAE/review"},{"name":"GA - Marietta","lat":34.030796592398474,"lng":-84.52514988505574,"url":"https://g.page/r/CY8tLupLcu_zEAE/review"},{"name":"SC - Greenville","lat":34.9185360446125,"lng":-82.2103692293696,"url":"https://g.page/r/CRMsG3B2y6RMEAE/review"},{"name":"SC - Spartanburg","lat":34.995429786433164,"lng":-81.91678115450303,"url":"https://g.page/r/CQyXnZpp4RsJEAE/review"},{"name":"TN - Nashville","lat":35.61100745479361,"lng":-87.04035662751835,"url":"https://g.page/r/CU4TdKhQyO4IEAE/review"},{"name":"Texas - Keller","lat":32.943720323698805,"lng":-97.25733872670105,"url":"https://g.page/r/CaxyLrVwl6ONEAE/review"},{"name":"Texas - McKinney","lat":33.305467517286665,"lng":-96.64600928572386,"url":"https://g.page/r/CcUdZIbH_D2ZEAE/review"}];
var done=false;
function show(id){["finding","going","pick"].forEach(function(x){document.getElementById(x).style.display=x===id?"block":"none"})}
function list(){var h="";branches.forEach(function(b){var s=document.createElement("div");h+='<div class="item"><span>'+b.name.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span><a href="'+encodeURI(b.url)+'">Leave a review</a></div>'});document.getElementById("items").innerHTML=h;show("pick")}
function dist(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;var q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
document.getElementById("manual").onclick=function(){done=true;list()};
if(!navigator.geolocation){list()}else{navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;var best=null,min=1e9;branches.forEach(function(b){var d=dist(p.coords.latitude,p.coords.longitude,b.lat,b.lng);if(d<min){min=d;best=b}});if(!best){list();return}document.getElementById("msg").textContent=best.name;show("going");window.location.href=best.url},function(){if(done)return;done=true;list()},{timeout:10000,maximumAge:300000})}
</script></body></html>
